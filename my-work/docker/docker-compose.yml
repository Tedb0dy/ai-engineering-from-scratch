services:
  ai-dev:
    build: .
    image: ai-dev-cpu
    volumes:
      - ../../:/workspace          # the repo root, mounted into the container
    ports:
      - "8889:8888"                # 8889 on your laptop, in case Jupyter is still on 8888
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: